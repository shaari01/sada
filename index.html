<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1720" />
  <meta name="description" content="صدى: محرر صوت وموسيقى متعدد المسارات يعمل بلا إنترنت" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>صدى · محرر الصوت</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="./icons/icon.svg" alt="" width="34" height="34" /><b>صدى</b></div>
      <button id="projName" class="proj-name" type="button" title="اسم المشروع (اضغط لتغييره)">مشروع جديد</button>
      <span id="saveState" class="save-state" aria-live="polite"></span>
      <div class="top-actions" id="topActions"></div>
    </header>
    <nav class="viewswitch" id="viewSwitch" role="tablist"></nav>
    <main id="main">
      <section id="timeline" aria-label="الموجة الصوتية"></section>
      <section id="cards" class="cards" aria-label="المقاطع"></section>
    </main>
    <div class="transport" id="transport"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="toolbar" id="toolbar" role="toolbar"></div>
  </div>
  <input type="file" id="fileInput" accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.oga,.opus,.flac,.aac,.webm,.mp4" multiple hidden />
  <script type="module" src="./src/main.js"></script>
</body>
</html>
